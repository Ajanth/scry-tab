on:
  push:
    branches:
      - master
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
  SENTRY_URL: ${{ secrets.SENTRY_URL }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_P12_CERTIFICATE: ${{ secrets.APPLE_P12_CERTIFICATE }}
  SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
  # `contents: write` on Ajanth/scrytab-public, where releases are published
  PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}
  GITHUB_EVENT_AFTER: ${{ github.event.after }}
  BUILD_DIR: ${{ github.workspace }}
  XCODE_BUILD_PATH: DerivedData/Build/Products/Release
  VERSION_FILE: VERSION.txt
  APP_NAME: ScryTab
jobs:
  build:
    runs-on: macos-15 # all options: https://github.com/actions/runner-images/tree/main
    environment: production
    steps:
#      - env:
#          GITHUB_CONTEXT: ${{ toJSON(github) }}
#        run: echo "$GITHUB_CONTEXT"
      - id: pre-checkout
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            COUNT=$(( $(echo "$COMMITS" | jq length) + 30 ))
          else
            COUNT=1
          fi
          echo "fetch-depth=$COUNT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ steps.pre-checkout.outputs.fetch-depth }}
      - uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: 'npm'
      - run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
      - run: scripts/print_env.sh
      - run: npm ci
      - run: npx commitlint --from "$GITHUB_EVENT_BEFORE" --to "$GITHUB_EVENT_AFTER" --verbose
      - run: scripts/ensure_generated_files_are_up_to_date.sh
      - run: scripts/determine_next_version.sh
      - run: scripts/replace_environment_variables_in_app.sh
      - run: scripts/codesign/setup_ci_master.sh
      - run: scripts/run_tests.sh
      - run: scripts/build_app.sh
      - run: scripts/package_and_notarize_release.sh
      - run: scripts/package_source_tarball.sh
      - run: scripts/upload_symbols_to_sentry.sh
      - run: scripts/update_appcast.sh
      - run: scripts/update_readme_and_website.sh
      - run: npx semantic-release
      - id: set_release_info
        run: scripts/extract_latest_changelog.sh
      # Releases are published to the public repo: this one is private, so its release assets
      # are unreachable for users, and GPL-3.0 §6(d) requires the source archive to be as
      # downloadable as the binary it corresponds to.
      - uses: softprops/action-gh-release@v3
        with:
          repository: Ajanth/scrytab-public
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: ${{ steps.set_release_info.outputs.tag_name }}
          body: ${{ steps.set_release_info.outputs.body }}
          files: |
            ${{ env.XCODE_BUILD_PATH }}/*.dmg
            ${{ env.XCODE_BUILD_PATH }}/*.zip
            ${{ env.XCODE_BUILD_PATH }}/*-source.tar.gz
      - run: scripts/update_website.sh
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
